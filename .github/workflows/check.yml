name: Check
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload installable plugin
        uses: actions/upload-artifact@v7.0.2
        with:
          name: translate-note-install
          path: dist/translate-note/
          if-no-files-found: error
          retention-days: 30
